[package]
name = "wincleaner"
version = "2.0.0"
edition = "2024"
rust-version = "1.92"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "renderer-software", "software-renderer-systemfonts", "software-renderer-path"] }

[target.'cfg(windows)'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["backend-winit", "accessibility", "unstable-winit-030"] }
winapi = { version = "0.3", features = ["shellapi", "shlobj", "knownfolders", "combaseapi", "objbase", "fileapi", "minwinbase", "winbase", "winnt", "winuser", "shtypes", "winerror", "winreg", "wingdi", "processenv", "jobapi2", "processthreadsapi", "synchapi", "handleapi", "tlhelp32", "psapi", "winver", "wintrust", "softpub", "mscat", "wincrypt", "sysinfoapi", "shobjidl_core", "objidl", "wbemcli", "oleauto", "oaidl", "winsvc", "taskschd"] }

[dev-dependencies]
png = "0.18"

[build-dependencies]
slint-build = "=1.18.1"
embed-resource = "3.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[patch.crates-io]
i-slint-backend-winit = { path = "vendor/i-slint-backend-winit" }
