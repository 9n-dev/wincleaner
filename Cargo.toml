[package]
name = "wincleaner"
version = "0.1.0"
edition = "2024"

[target.'cfg(windows)'.dependencies]
native-windows-gui = { version = "1.0", default-features = false, features = ["tabs", "list-view", "progress-bar", "notice", "combobox", "status-bar", "high-dpi"] }
winapi = { version = "0.3", features = ["shellapi", "shlobj", "knownfolders", "combaseapi", "fileapi", "winbase", "winuser", "shtypes", "winerror"] }

[build-dependencies]
embed-resource = "3.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
